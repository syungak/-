<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作業記録">
  <title>作業記録</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-border: #2c2c2e;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --primary: #0a84ff;
      --danger: #ff453a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Kaku Gothic ProN", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 8px 4px 4px;
    }
    .header-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .header-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    }

    /* 検索バー */
    .search-box {
      position: relative;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* タグフィルターバー & ＋追加ボタン */
    .tag-scroll-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tag-scroll-container::-webkit-scrollbar {
      display: none;
    }
    .filter-pill {
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      background: #1c1c1e;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-pill.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }
    .filter-pill-add {
      background: rgba(10, 132, 255, 0.15);
      color: var(--primary);
      border: 1px dashed rgba(10, 132, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 合計カード */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .summary-time {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .summary-count-wrap {
      text-align: right;
    }
    .summary-count {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    /* 記録カードリスト */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .log-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-tag-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .log-duration {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .log-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      user-select: text;
    }
    .log-memo {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      user-select: text;
    }
    .log-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .log-timestamp {
      font-size: 12px;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
    }
    .btn-delete {
      background: none;
      border: none;
      color: #636366;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .btn-delete:active {
      color: var(--danger);
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #1c1c1e;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 34px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid #3a3a3c;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .form-input {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .modal-tag-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .modal-tag-pill {
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #3a3a3c;
      cursor: pointer;
    }
    .modal-tag-pill.selected {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div>
      <div class="header-date" id="currentDateText">--月--日 (--)</div>
      <div class="header-title">作業記録</div>
    </div>
    <div class="header-actions">
      <button class="btn-circle" onclick="openAddModal()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <!-- 検索バー -->
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="作業内容やメモを検索..." oninput="renderLogs()">
  </div>

  <!-- タグフィルター＆追加ボタン -->
  <div class="tag-scroll-container" id="tagFilterContainer"></div>

  <!-- 今日の集計カード -->
  <div class="summary-card">
    <div>
      <div class="summary-label">本日の合計作業時間</div>
      <div class="summary-time" id="todayTotalTime">0時間 0分</div>
    </div>
    <div class="summary-count-wrap">
      <div class="summary-label">表示件数</div>
      <div class="summary-count" id="logCount">0 件</div>
    </div>
  </div>

  <!-- 記録リスト -->
  <div class="log-list" id="logListContainer"></div>
</div>

<!-- 新規記録追加モーダル（過去日付指定対応） -->
<div class="modal-overlay" id="addModal" onclick="closeModalOnOut(event)">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title">作業を記録</span>
      <button class="btn-close" onclick="closeAddModal()">キャンセル</button>
    </div>

    <!-- 作業日時指定（別の日・過去の作業追加） -->
    <div class="form-group">
      <span class="form-label">作業日時（過去の日付も選択可能）</span>
      <input type="datetime-local" class="form-input" id="inputDateTime">
    </div>

    <div class="form-group">
      <span class="form-label">作業内容（タグ）</span>
      <div class="modal-tag-selector" id="modalTagSelector"></div>
    </div>

    <div class="form-group">
      <span class="form-label">作業タイトル / 品名</span>
      <input type="text" class="form-input" id="inputTitle" placeholder="例: ジャガイモ焼酎移動、ポンプ清掃">
    </div>

    <div class="form-group">
      <span class="form-label">作業時間（分）</span>
      <input type="number" class="form-input" id="inputDuration" placeholder="例: 60" value="60">
    </div>

    <div class="form-group">
      <span class="form-label">詳細メモ（任意）</span>
      <input type="text" class="form-input" id="inputMemo" placeholder="備考、担当者、留意事項など">
    </div>

    <button class="btn-submit" onclick="saveNewLog()">保存する</button>
  </div>
</div>

<script>
  const DEFAULT_TAGS = ['焼酎', 'ウイスキー', '事務作業', 'その他'];
  const STORAGE_KEY_LOGS = 'worklog_records_v1';
  const STORAGE_KEY_TAGS = 'worklog_custom_tags_v1';

  let customTags = JSON.parse(localStorage.getItem(STORAGE_KEY_TAGS)) || DEFAULT_TAGS;
  let workLogs = JSON.parse(localStorage.getItem(STORAGE_KEY_LOGS)) || [
    { id: 1, tag: 'その他', title: '健康診断', memo: '', duration: 60, timestamp: '2026-09-07T09:15:00' },
    { id: 2, tag: 'その他', title: '発酵室掃除水タンク内掃除（休日出勤）ポンプ周り清掃', memo: '川崎さんと自分はポンプ周り清掃（10時頃終わり）', duration: 120, timestamp: '2026-09-05T12:01:00' },
    { id: 3, tag: 'その他', title: '発酵室清掃準備', memo: '明日の発酵室清掃準備', duration: 30, timestamp: '2026-09-04T17:19:00' },
    { id: 4, tag: '焼酎', title: 'ジャガイモ焼酎移動', memo: '', duration: 60, timestamp: '2026-09-04T12:12:00' },
    { id: 5, tag: '焼酎', title: '逆洗浄', memo: '', duration: 60, timestamp: '2026-09-04T12:12:00' }
  ];

  let currentFilter = 'すべて';
  let selectedModalTag = customTags[0] || 'その他';

  function updateDateHeader() {
    const now = new Date();
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const month = now.getMonth() + 1;
    const date = now.getDate();
    const day = days[now.getDay()];
    document.getElementById('currentDateText').textContent = `${month}月${date}日 (${day})`;
  }

  function renderTags() {
    const container = document.getElementById('tagFilterContainer');
    container.innerHTML = '';

    const allBtn = document.createElement('div');
    allBtn.className = `filter-pill ${currentFilter === 'すべて' ? 'active' : ''}`;
    allBtn.textContent = 'すべて';
    allBtn.onclick = () => { currentFilter = 'すべて'; renderTags(); renderLogs(); };
    container.appendChild(allBtn);

    customTags.forEach(tag => {
      const pill = document.createElement('div');
      pill.className = `filter-pill ${currentFilter === tag ? 'active' : ''}`;
      pill.textContent = tag;
      pill.onclick = () => { currentFilter = tag; renderTags(); renderLogs(); };
      container.appendChild(pill);
    });

    const addBtn = document.createElement('div');
    addBtn.className = 'filter-pill filter-pill-add';
    addBtn.innerHTML = '+ 追加';
    addBtn.onclick = promptAddNewTag;
    container.appendChild(addBtn);
  }

  function promptAddNewTag() {
    const newTag = prompt('新しい作業内容（タグ名）を入力してください:');
    if (!newTag) return;
    const trimmed = newTag.trim();
    if (!trimmed) return;

    if (customTags.includes(trimmed)) {
      alert('その作業内容は既に追加されています。');
      return;
    }

    customTags.push(trimmed);
    localStorage.setItem(STORAGE_KEY_TAGS, JSON.stringify(customTags));
    renderTags();
    renderModalTags();
  }

  function renderModalTags() {
    const container = document.getElementById('modalTagSelector');
    container.innerHTML = '';
    customTags.forEach(tag => {
      const pill = document.createElement('div');
      pill.className = `modal-tag-pill ${selectedModalTag === tag ? 'selected' : ''}`;
      pill.textContent = tag;
      pill.onclick = () => {
        selectedModalTag = tag;
        renderModalTags();
      };
      container.appendChild(pill);
    });
  }

  function renderLogs() {
    const container = document.getElementById('logListContainer');
    const query = document.getElementById('searchInput').value.toLowerCase();
    container.innerHTML = '';

    // 日付順（新しい順）にソート
    workLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    const filtered = workLogs.filter(item => {
      const matchFilter = (currentFilter === 'すべて' || item.tag === currentFilter);
      const matchQuery = !query || item.title.toLowerCase().includes(query) || (item.memo && item.memo.toLowerCase().includes(query));
      return matchFilter && matchQuery;
    });

    document.getElementById('logCount').textContent = `${filtered.length} 件`;

    // 「今日の日付」の作業時間のみ集計
    const today = new Date();
    const y = today.getFullYear();
    const m = String(today.getMonth() + 1).padStart(2, '0');
    const d = String(today.getDate()).padStart(2, '0');
    const todayPrefix = `${y}-${m}-${d}`;

    const todayMinutes = workLogs
      .filter(i => (i.timestamp || '').startsWith(todayPrefix))
      .reduce((sum, cur) => sum + (parseInt(cur.duration) || 0), 0);
    const hours = Math.floor(todayMinutes / 60);
    const mins = todayMinutes % 60;
    document.getElementById('todayTotalTime').textContent = `${hours}時間 ${mins}分`;

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'log-card';

      const dt = new Date(item.timestamp);
      const timeStr = isNaN(dt.getTime()) ? '' : `${dt.getMonth() + 1}/${dt.getDate()} ${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
      const durationStr = item.duration >= 60 ? `${item.duration / 60}時間` : `${item.duration}分`;

      card.innerHTML = `
        <div class="log-card-header">
          <span class="log-tag-badge">${escapeHtml(item.tag)}</span>
          <span class="log-duration">${durationStr}</span>
        </div>
        <div class="log-title">${escapeHtml(item.title)}</div>
        ${item.memo ? `<div class="log-memo">${escapeHtml(item.memo)}</div>` : ''}
        <div class="log-card-footer">
          <span class="log-timestamp">${timeStr}</span>
          <button class="btn-delete" onclick="deleteLog(${item.id})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function deleteLog(id) {
    if (!confirm('この作業記録を削除しますか？')) return;
    workLogs = workLogs.filter(i => i.id !== id);
    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(workLogs));
    renderLogs();
  }

  function getLocalIsoString(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function openAddModal() {
    renderModalTags();
    // 日時の初期値を「現在日時」にセット
    document.getElementById('inputDateTime').value = getLocalIsoString(new Date());
    document.getElementById('addModal').style.display = 'flex';
  }
  function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
  }
  function closeModalOnOut(e) {
    if (e.target.id === 'addModal') closeAddModal();
  }

  function saveNewLog() {
    const title = document.getElementById('inputTitle').value.trim();
    const duration = parseInt(document.getElementById('inputDuration').value) || 30;
    const memo = document.getElementById('inputMemo').value.trim();
    const inputDt = document.getElementById('inputDateTime').value;

    if (!title) {
      alert('作業タイトルを入力してください');
      return;
    }

    const timestamp = inputDt ? new Date(inputDt).toISOString() : new Date().toISOString();

    const newRecord = {
      id: Date.now(),
      tag: selectedModalTag,
      title: title,
      memo: memo,
      duration: duration,
      timestamp: timestamp
    };

    workLogs.unshift(newRecord);
    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(workLogs));

    document.getElementById('inputTitle').value = '';
    document.getElementById('inputMemo').value = '';
    closeAddModal();
    renderLogs();
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }

  updateDateHeader();
  renderTags();
  renderLogs();
</script>
</body>
</html>
