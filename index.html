<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作業記録">
  <title>作業記録</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #1c1c1e;
      --card-border: #2c2c2e;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --primary: #0a84ff;
      --danger: #ff453a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Kaku Gothic ProN", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 8px 4px 4px;
    }
    .header-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .header-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
    }

    .search-box {
      position: relative;
      width: 100%;
    }
    .search-box input {
      width: 100%;
      background: #1c1c1e;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 14px 10px 38px;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    .tag-scroll-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .tag-scroll-container::-webkit-scrollbar {
      display: none;
    }
    .filter-pill {
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 13px;
      font-weight: 600;
      background: #1c1c1e;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-pill.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }
    .filter-pill-add {
      background: rgba(10, 132, 255, 0.15);
      color: var(--primary);
      border: 1px dashed rgba(10, 132, 255, 0.4);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .summary-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 4px;
    }
    .summary-time {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .summary-count-wrap {
      text-align: right;
    }
    .summary-count {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }

    /* 日付グループ表示 */
    .date-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 8px;
    }
    .date-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 4px 2px;
      border-bottom: 1px solid #2c2c2e;
    }
    .date-group-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 0.3px;
    }
    .date-group-sub {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .log-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
    }
    .log-card:active {
      background: #252528;
    }
    .log-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .log-tag-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    .log-duration {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .log-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.4;
      user-select: text;
    }
    .log-memo {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      user-select: text;
    }
    .log-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    .log-timestamp {
      font-size: 12px;
      color: #8e8e93;
      font-variant-numeric: tabular-nums;
    }
    .log-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-action-icon {
      background: none;
      border: none;
      color: #636366;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .btn-action-icon:active {
      color: var(--primary);
    }
    .btn-delete:active {
      color: var(--danger);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #1c1c1e;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px 20px 34px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid #3a3a3c;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 700;
    }
    .btn-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      cursor: pointer;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .form-input {
      background: #2c2c2e;
      border: 1px solid #3a3a3c;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    .modal-tag-selector {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .modal-tag-pill {
      padding: 6px 14px;
      border-radius: 14px;
      font-size: 13px;
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #3a3a3c;
      cursor: pointer;
    }
    .modal-tag-pill.selected {
      background: var(--primary);
      border-color: var(--primary);
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div>
      <div class="header-date" id="currentDateText">--月--日 (--)</div>
      <div class="header-title">作業記録</div>
    </div>
    <div class="header-actions">
      <button class="btn-circle" onclick="openAddModal()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>
  </header>

  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="作業内容やメモを検索..." oninput="renderLogs()">
  </div>

  <div class="tag-scroll-container" id="tagFilterContainer"></div>

  <div class="summary-card">
    <div>
      <div class="summary-label">本日の合計作業時間</div>
      <div class="summary-time" id="todayTotalTime">0時間 0分</div>
    </div>
    <div class="summary-count-wrap">
      <div class="summary-label">表示件数</div>
      <div class="summary-count" id="logCount">0 件</div>
    </div>
  </div>

  <div class="log-list" id="logListContainer"></div>
</div>

<div class="modal-overlay" id="addModal" onclick="closeModalOnOut(event)">
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="modalHeaderTitle">作業を記録</span>
      <button class="btn-close" onclick="closeAddModal()">キャンセル</button>
    </div>

    <input type="hidden" id="editLogId" value="">

    <div class="form-group">
      <span class="form-label">作業日時（過去の日付も選択可能）</span>
      <input type="datetime-local" class="form-input" id="inputDateTime">
    </div>

    <div class="form-group">
      <span class="form-label">作業内容（タグ）</span>
      <div class="modal-tag-selector" id="modalTagSelector"></div>
    </div>

    <div class="form-group">
      <span class="form-label">作業タイトル / 品名</span>
      <input type="text" class="form-input" id="inputTitle" placeholder="例: ジャガイモ焼酎移動、ポンプ清掃">
    </div>

    <div class="form-group">
      <span class="form-label">作業時間（分）</span>
      <input type="number" class="form-input" id="inputDuration" placeholder="例: 60" value="60">
    </div>

    <div class="form-group">
      <span class="form-label">詳細メモ（任意）</span>
      <input type="text" class="form-input" id="inputMemo" placeholder="備考、担当者、留意事項など">
    </div>

    <button class="btn-submit" id="btnSubmitText" onclick="saveLog()">保存する</button>
  </div>
</div>

<script>
  const DEFAULT_TAGS = ['焼酎', 'ウイスキー', '事務作業', 'その他'];
  const STORAGE_KEY_LOGS = 'worklog_records_v1';
  const STORAGE_KEY_TAGS = 'worklog_custom_tags_v1';

  let customTags = JSON.parse(localStorage.getItem(STORAGE_KEY_TAGS)) || DEFAULT_TAGS;
  let workLogs = JSON.parse(localStorage.getItem(STORAGE_KEY_LOGS)) || [];

  let currentFilter = 'すべて';
  let selectedModalTag = customTags[0] || 'その他';

  function updateDateHeader() {
    const now = new Date();
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const month = now.getMonth() + 1;
    const date = now.getDate();
    const day = days[now.getDay()];
    document.getElementById('currentDateText').textContent = `${month}月${date}日 (${day})`;
  }

  function renderTags() {
    const container = document.getElementById('tagFilterContainer');
    container.innerHTML = '';

    const allBtn = document.createElement('div');
    allBtn.className = `filter-pill ${currentFilter === 'すべて' ? 'active' : ''}`;
    allBtn.textContent = 'すべて';
    allBtn.onclick = () => { currentFilter = 'すべて'; renderTags(); renderLogs(); };
    container.appendChild(allBtn);

    customTags.forEach(tag => {
      const pill = document.createElement('div');
      pill.className = `filter-pill ${currentFilter === tag ? 'active' : ''}`;
      pill.textContent = tag;
      pill.onclick = () => { currentFilter = tag; renderTags(); renderLogs(); };
      container.appendChild(pill);
    });

    const addBtn = document.createElement('div');
    addBtn.className = 'filter-pill filter-pill-add';
    addBtn.innerHTML = '+ 追加';
    addBtn.onclick = promptAddNewTag;
    container.appendChild(addBtn);
  }

  function promptAddNewTag() {
    const newTag = prompt('新しい作業内容（タグ名）を入力してください:');
    if (!newTag) return;
    const trimmed = newTag.trim();
    if (!trimmed) return;

    if (customTags.includes(trimmed)) {
      alert('その作業内容は既に追加されています。');
      return;
    }

    customTags.push(trimmed);
    localStorage.setItem(STORAGE_KEY_TAGS, JSON.stringify(customTags));
    renderTags();
    renderModalTags();
  }

  function renderModalTags() {
    const container = document.getElementById('modalTagSelector');
    container.innerHTML = '';
    customTags.forEach(tag => {
      const pill = document.createElement('div');
      pill.className = `modal-tag-pill ${selectedModalTag === tag ? 'selected' : ''}`;
      pill.textContent = tag;
      pill.onclick = () => {
        selectedModalTag = tag;
        renderModalTags();
      };
      container.appendChild(pill);
    });
  }

  function formatDateGroupHeader(dateKey) {
    const today = new Date();
    const pad = n => String(n).padStart(2, '0');
    const todayKey = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

    const yesterday = new Date(today);
    yesterday.setDate(today.getDate() - 1);
    const yesterdayKey = `${yesterday.getFullYear()}-${pad(yesterday.getMonth() + 1)}-${pad(yesterday.getDate())}`;

    const [y, m, d] = dateKey.split('-').map(Number);
    const targetDate = new Date(y, m - 1, d);
    const days = ['日', '月', '火', '水', '木', '金', '土'];
    const dayStr = days[targetDate.getDay()];

    if (dateKey === todayKey) {
      return `今日 (${m}月${d}日 · ${dayStr})`;
    } else if (dateKey === yesterdayKey) {
      return `昨日 (${m}月${d}日 · ${dayStr})`;
    } else {
      return `${m}月${d}日 (${dayStr})`;
    }
  }

  function renderLogs() {
    const container = document.getElementById('logListContainer');
    const query = document.getElementById('searchInput').value.toLowerCase();
    container.innerHTML = '';

    // 日時降順（新しい順）
    workLogs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

    const filtered = workLogs.filter(item => {
      const matchFilter = (currentFilter === 'すべて' || item.tag === currentFilter);
      const matchQuery = !query || item.title.toLowerCase().includes(query) || (item.memo && item.memo.toLowerCase().includes(query));
      return matchFilter && matchQuery;
    });

    document.getElementById('logCount').textContent = `${filtered.length} 件`;

    // 本日の合計作業時間を計算
    const today = new Date();
    const pad = n => String(n).padStart(2, '0');
    const todayPrefix = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;

    const todayMinutes = workLogs
      .filter(i => (i.timestamp || '').startsWith(todayPrefix))
      .reduce((sum, cur) => sum + (parseInt(cur.duration) || 0), 0);
    const hours = Math.floor(todayMinutes / 60);
    const mins = todayMinutes % 60;
    document.getElementById('todayTotalTime').textContent = `${hours}時間 ${mins}分`;

    // 日付ごとにグループ化
    const groups = {};
    filtered.forEach(item => {
      const dt = new Date(item.timestamp);
      const dateKey = isNaN(dt.getTime())
        ? 'その他'
        : `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`;
      if (!groups[dateKey]) groups[dateKey] = [];
      groups[dateKey].push(item);
    });

    // グループを描画
    Object.keys(groups).forEach(dateKey => {
      const items = groups[dateKey];
      const dayTotalMinutes = items.reduce((sum, cur) => sum + (parseInt(cur.duration) || 0), 0);
      const dHours = Math.floor(dayTotalMinutes / 60);
      const dMins = dayTotalMinutes % 60;
      const dayTimeStr = dHours > 0 ? `${dHours}時間${dMins > 0 ? ` ${dMins}分` : ''}` : `${dMins}分`;

      const groupDiv = document.createElement('div');
      groupDiv.className = 'date-group';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'date-group-header';
      headerDiv.innerHTML = `
        <span class="date-group-title">${formatDateGroupHeader(dateKey)}</span>
        <span class="date-group-sub">計 ${dayTimeStr} (${items.length}件)</span>
      `;
      groupDiv.appendChild(headerDiv);

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'log-card';
        card.onclick = (e) => {
          if (e.target.closest('button')) return;
          openEditModal(item.id);
        };

        const dt = new Date(item.timestamp);
        const timeStr = isNaN(dt.getTime()) ? '' : `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        const durationStr = item.duration >= 60 ? `${item.duration / 60}時間` : `${item.duration}分`;

        card.innerHTML = `
          <div class="log-card-header">
            <span class="log-tag-badge">${escapeHtml(item.tag)}</span>
            <span class="log-duration">${durationStr}</span>
          </div>
          <div class="log-title">${escapeHtml(item.title)}</div>
          ${item.memo ? `<div class="log-memo">${escapeHtml(item.memo)}</div>` : ''}
          <div class="log-card-footer">
            <span class="log-timestamp">開始時刻: ${timeStr}</span>
            <div class="log-actions">
              <button class="btn-action-icon" title="編集" onclick="openEditModal(${item.id})">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
              </button>
              <button class="btn-action-icon btn-delete" title="削除" onclick="deleteLog(${item.id})">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </div>
        `;
        groupDiv.appendChild(card);
      });

      container.appendChild(groupDiv);
    });
  }

  function deleteLog(id) {
    if (!confirm('この作業記録を削除しますか？')) return;
    workLogs = workLogs.filter(i => i.id !== id);
    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(workLogs));
    renderLogs();
  }

  function getLocalIsoString(date) {
    const pad = n => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
  }

  function openAddModal() {
    document.getElementById('editLogId').value = '';
    document.getElementById('modalHeaderTitle').textContent = '作業を記録';
    document.getElementById('btnSubmitText').textContent = '保存する';
    document.getElementById('inputTitle').value = '';
    document.getElementById('inputDuration').value = '60';
    document.getElementById('inputMemo').value = '';
    selectedModalTag = customTags[0] || 'その他';
    renderModalTags();
    document.getElementById('inputDateTime').value = getLocalIsoString(new Date());
    document.getElementById('addModal').style.display = 'flex';
  }

  function openEditModal(id) {
    const target = workLogs.find(i => i.id === id);
    if (!target) return;

    document.getElementById('editLogId').value = target.id;
    document.getElementById('modalHeaderTitle').textContent = '作業内容を編集';
    document.getElementById('btnSubmitText').textContent = '更新する';
    document.getElementById('inputTitle').value = target.title;
    document.getElementById('inputDuration').value = target.duration;
    document.getElementById('inputMemo').value = target.memo || '';
    selectedModalTag = target.tag;
    renderModalTags();

    const dt = new Date(target.timestamp);
    document.getElementById('inputDateTime').value = isNaN(dt.getTime()) ? getLocalIsoString(new Date()) : getLocalIsoString(dt);
    document.getElementById('addModal').style.display = 'flex';
  }

  function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
  }

  function closeModalOnOut(e) {
    if (e.target.id === 'addModal') closeAddModal();
  }

  function saveLog() {
    const title = document.getElementById('inputTitle').value.trim();
    const duration = parseInt(document.getElementById('inputDuration').value) || 30;
    const memo = document.getElementById('inputMemo').value.trim();
    const inputDt = document.getElementById('inputDateTime').value;
    const editId = document.getElementById('editLogId').value;

    if (!title) {
      alert('作業タイトルを入力してください');
      return;
    }

    const timestamp = inputDt ? new Date(inputDt).toISOString() : new Date().toISOString();

    if (editId) {
      const idx = workLogs.findIndex(i => String(i.id) === String(editId));
      if (idx !== -1) {
        workLogs[idx].tag = selectedModalTag;
        workLogs[idx].title = title;
        workLogs[idx].duration = duration;
        workLogs[idx].memo = memo;
        workLogs[idx].timestamp = timestamp;
      }
    } else {
      const newRecord = {
        id: Date.now(),
        tag: selectedModalTag,
        title: title,
        memo: memo,
        duration: duration,
        timestamp: timestamp
      };
      workLogs.unshift(newRecord);
    }

    localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(workLogs));
    closeAddModal();
    renderLogs();
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>'"]/g, tag => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    }[tag] || tag));
  }

  updateDateHeader();
  renderTags();
  renderLogs();
</script>
</body>
</html>
